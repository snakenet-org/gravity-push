name: 'snakeNet Pulsar Push'
description: 'Send a Web Push notification to a Pulsar Topic, authenticated by a Pulsar API key.'
author: 'snakenet.org'

branding:
  icon: 'radio'
  color: 'blue'

inputs:
  push_service_url:
    description: 'Base URL of the Pulsar instance, e.g. https://snakenet.org/'
    required: true
  push_service_api_key:
    description: >-
      Pulsar API key carrying the "Can Notify via Push" entitlement, sent as X-Api-Key. Create
      one from Pulsar's /api-keys page. Treat as a secret.
    required: true
  push_service_token:
    description: >-
      Pulsar's shared service secret, sent as X-Ophion-Token. Treat as a secret.
    required: true
  push_topic_id:
    description: >-
      UUID of the Pulsar Topic to notify. Find available Topics on Pulsar's /topics management
      page.
    required: true
  push_message_title:
    description: 'Push notification title.'
    required: true
  push_message_body:
    description: 'Push notification body.'
    required: true
  push_message_url:
    description: 'URL opened when the notification is clicked. Optional.'
    required: false
    default: ''

outputs:
  subscribers:
    description: 'Number of Topic subscribers targeted.'
  sent:
    description: 'Number of notifications successfully delivered.'
  failed:
    description: 'Number of notifications that failed to deliver.'
  pruned:
    description: 'Number of dead subscriptions pruned during this send.'

runs:
  using: 'node24'
  main: 'dist/index.js'
