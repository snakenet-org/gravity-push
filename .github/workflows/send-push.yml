name: Send Gravity Push Notification

on:
  workflow_dispatch:
    inputs:
      push_topic_id:
        description: 'UUID of the Gravity Topic to notify'
        required: true
      push_message_title:
        description: 'Notification title'
        required: true
      push_message_body:
        description: 'Notification body'
        required: true
      push_message_url:
        description: 'URL opened when the notification is clicked (optional)'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate, provision, and send
        uses: ./
        with:
          identity_provider_url: ${{ secrets.IDENTITY_PROVIDER_URL }}
          m2m_client_id: ${{ secrets.M2M_CLIENT_ID }}
          m2m_username: ${{ secrets.M2M_USERNAME }}
          m2m_password: ${{ secrets.M2M_PASSWORD }}
          push_service_url: ${{ secrets.PUSH_SERVICE_URL }}
          push_service_token: ${{ secrets.PUSH_SERVICE_TOKEN }}
          push_topic_id: ${{ inputs.push_topic_id }}
          push_message_title: ${{ inputs.push_message_title }}
          push_message_body: ${{ inputs.push_message_body }}
          push_message_url: ${{ inputs.push_message_url }}
